<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>EsToDoList</title>
</head>
<body class="bg-slate-100 text-slate-950 min-h-screen">

    <header class="bg-purple-500 text-white">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
         <h1 class="text-2xl font-bold">EsToDoList</h1>
         <p class="hidden text-sm md:inline">Organize sua rotina escolar</p>
        </div>
    </header>
    <main>
        
        <!-- Coluna 1: Criar, pesquisar e filtar -->
        <section>
            <form>
                <input type="text" placeholder="Nova tarefa">
                <input type="date">
                <button>Adicionar</button>
            </form>
            <input type="text" placeholder="Pesquisar tarefa...">
            <div>
                <button>Todas</button>
                <button>Pendentes</button>
                <button>Concluídas</button>
            </div>
        </section>

        <!-- Coluna 2: Lista de tarefas -->
        <section>
            <ul>
                <li> 
                    <label>
                        <input type="checkbox">
                        <span>
                            <span>Trabalho de História</span>
                            <span>20/10/2026</span>
                        </span>
                    </label>
                    <div>
                        <button>Editar</button>
                        <button>Excluir</button>
                    </div>
                </li>

                <li> 
                    <label>
                        <input type="checkbox">
                        <span>
                            <span>SELIBI</span>
                            <span>25/10/2026</span>
                        </span>
                    </label>
                    <div>
                        <button>Editar</button>
                        <button>Excluir</button>
                    </div>
                </li>

                <li> 
                    <label>
                        <input type="checkbox">
                        <span>
                            <span>LETRUS</span>
                            <span>19/10/2026</span>
                        </span>
                    </label>
                    <div>
                        <button>Editar</button>
                        <button>Excluir</button>
                    </div>
                </li>
            </ul>
            <p2>2 Tarefas Pendentes</p2>

        
        </section>

    </main>
</body>

</html>
